name: aeon-language

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ---------------------------------------------------------------------
  # unit + property tests across a Python version matrix
  # ---------------------------------------------------------------------
  tests:
    name: tests (py ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        working-directory: aeon-language
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy
      - name: Run test suite
        working-directory: aeon-language
        run: |
          PYTHONPATH="$(pwd)/standard_library:$(pwd)" python -m pytest tests/ -q

  # ---------------------------------------------------------------------
  # PYTHONHASHSEED matrix: canonicalization and replay must be
  # byte-identical across hash seeds.
  # ---------------------------------------------------------------------
  determinism:
    name: determinism (seed ${{ matrix.hashseed }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hashseed: ["0", "1", "42", "random"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: aeon-language
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy
      - name: Deterministic replay across hash seed
        working-directory: aeon-language
        env:
          PYTHONHASHSEED: ${{ matrix.hashseed }}
        run: |
          PYTHONPATH="$(pwd)/standard_library:$(pwd)" \
            python -m pytest tests/test_fresh_process_replay.py tests/test_canonicalization_collisions.py -q

  # ---------------------------------------------------------------------
  # Clean-install test: install the package from pyproject.toml into a
  # fresh venv, then invoke each CLI tool through the installed console
  # entry points.
  # ---------------------------------------------------------------------
  clean_install:
    name: clean-install CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and install
        working-directory: aeon-language
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          pip install dist/*.whl
      - name: CLI smoke
        working-directory: aeon-language
        run: |
          aeoncheck examples/two_sources.aeon
          aeonc examples/two_sources.aeon -o /tmp/tv.ir.json --seed 1 --ticks-per-clock 4
          aeonir /tmp/tv.ir.json
          aeonfmt examples/two_sources.aeon --check
          aeongraph examples/two_sources.aeon > /tmp/tv.dot
          aeonreplay examples/two_sources.aeon --seed 1 --ticks-per-clock 4
          aeonrun examples/two_sources.aeon --seed 1 --ticks-per-clock 4

  # ---------------------------------------------------------------------
  # Cross-backend differential + conformance profiles
  # ---------------------------------------------------------------------
  backend_differential:
    name: backend differential + conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: aeon-language
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy
      - name: Cross-backend differential
        working-directory: aeon-language
        run: |
          PYTHONPATH="$(pwd)/standard_library:$(pwd)" \
            python -m pytest tests/test_backend_differential.py -q
      - name: Conformance runner (JSON)
        working-directory: aeon-language
        run: |
          PYTHONPATH="$(pwd)/standard_library:$(pwd)" \
            python -m conformance.runner --json \
              --profile CORE --profile SOURCE_REQUIRED --profile SOURCE_RICH \
              --profile RECURSION_SUBSTRATE --profile COMPILER --profile RUNTIME \
              --profile BACKEND --profile STDLIB
