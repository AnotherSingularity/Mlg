name: aeon-application

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  app_tests:
    name: aeon-app tests (py ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy
      - name: Run aeon-app test suite (source tree)
        working-directory: aeon-application
        run: |
          python -m pytest tests/ -q
