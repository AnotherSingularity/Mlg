name: aeon-application

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  app_tests:
    name: aeon-app tests (py ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy
      - name: Run aeon-app test suite (source tree)
        working-directory: aeon-application
        run: |
          python -m pytest tests/ -q

  app_clean_install:
    name: aeon-app clean install + CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install aeon-language + aeon-application from source
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./aeon-language
          python -m pip install --no-deps ./aeon-application
      - name: Verify all eight aeon-app-* console scripts
        run: |
          for cmd in aeon-app-check aeon-app-compile aeon-app-run \
                    aeon-app-train aeon-app-evaluate aeon-app-snapshot \
                    aeon-app-replay aeon-app-inspect; do
            command -v "$cmd" || { echo "MISSING: $cmd"; exit 1; }
          done
      - name: "Smoke - check + inspect + run + train"
        run: |
          aeon-app-check
          aeon-app-inspect
          aeon-app-run --ticks 2
          aeon-app-train --steps 1 --ticks 4
      - name: "Smoke - snapshot + replay round-trip"
        run: |
          aeon-app-snapshot --out /tmp/session.snap --ticks 2
          aeon-app-replay   --snapshot /tmp/session.snap --ticks 2

  app_conformance:
    name: aeon-app conformance suite (all REQUIRED profiles)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pyhashseed: ["0", "1", "42", "random"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy
      - name: Run conformance suite (PYTHONHASHSEED=${{ matrix.pyhashseed }})
        working-directory: aeon-application
        env:
          PYTHONHASHSEED: ${{ matrix.pyhashseed }}
          PYTHONPATH: src:../aeon-language/standard_library:../aeon-language
        run: |
          python -m aeon_app.conformance \
            --profile CONFIG --profile SOURCE --profile PROJECTION \
            --profile RECURSION --profile SCHEDULER --profile FEEDBACK \
            --profile PERSISTENCE --profile TRAINING

  app_certified_activation:
    name: aeon-app certified activation (startup + no-fallback + soak)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy
      - name: Run certified-mode tests (tests/test_certified.py)
        working-directory: aeon-application
        env:
          PYTHONPATH: src:../aeon-language/standard_library:../aeon-language
        run: |
          python -m pytest tests/test_certified.py -q
      - name: Certified startup probe via aeon-app-check
        run: |
          python -m pip install ./aeon-language
          python -m pip install --no-deps ./aeon-application
          aeon-app-check | tee /tmp/check.json
          python -c "import json; d=json.load(open('/tmp/check.json')); assert d['certified_execution_ready'] is True, d; assert d['runtime_mode']=='CERTIFIED', d"
      - name: Certified snapshot + replay round-trip (installed CLI)
        run: |
          aeon-app-snapshot --out /tmp/certified.snap --ticks 4
          aeon-app-replay   --snapshot /tmp/certified.snap --ticks 4
      - name: Certified inspect must match frozen identities
        run: |
          aeon-app-inspect | tee /tmp/inspect.json
          python -c "import json; d=json.load(open('/tmp/inspect.json')); assert d['frozen_certified']['matches_frozen'] is True, d; assert d['runtime_mode']=='CERTIFIED', d"
