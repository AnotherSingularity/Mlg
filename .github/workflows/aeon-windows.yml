name: aeon-windows

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# L16 packaging must run on a genuine Windows host. The mandate
# rejects Linux-built binaries renamed .exe. Every job in this
# workflow requires windows-latest.

jobs:
  windows-package:
    name: build Windows bundle + installer
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime + PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./aeon-language
          python -m pip install --no-deps ./aeon-application
          python -m pip install pyinstaller

      - name: Build PyInstaller onedir bundle
        shell: pwsh
        working-directory: aeon-application/packaging/windows
        run: |
          pyinstaller --clean --noconfirm aeon-launcher.spec
          dir ..\..\dist\aeon-launcher

      - name: Bundle sanity check (invoke launcher with --smoke)
        shell: pwsh
        working-directory: aeon-application
        run: |
          dist\aeon-launcher\aeon-launcher.exe --smoke > bundle-smoke.json
          type bundle-smoke.json
          python -c "import json; d=json.load(open('bundle-smoke.json')); assert d['ok'] is True, d; assert d['runtime_mode']=='CERTIFIED', d"

      - name: Build Inno Setup installer
        shell: pwsh
        working-directory: aeon-application/packaging/windows
        run: |
          # Inno Setup 6 is preinstalled on GitHub Actions windows-latest.
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc aeon-installer.iss
          dir Output

      - name: Compute SHA-256 checksums
        shell: pwsh
        working-directory: aeon-application
        run: |
          Get-ChildItem packaging\windows\Output\*.exe |
            Get-FileHash -Algorithm SHA256 |
            Format-List | Tee-Object -FilePath windows-installer.sha256.txt
          Get-ChildItem dist\aeon-launcher\aeon-launcher.exe |
            Get-FileHash -Algorithm SHA256 |
            Format-List | Tee-Object -FilePath windows-bundle.sha256.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aeon-windows-artifacts
          path: |
            aeon-application/dist/aeon-launcher/**
            aeon-application/packaging/windows/Output/*.exe
            aeon-application/windows-installer.sha256.txt
            aeon-application/windows-bundle.sha256.txt
            aeon-application/bundle-smoke.json
          if-no-files-found: error

  windows-clean-install:
    name: silent-install + certified-smoke + snapshot/replay
    needs: windows-package
    runs-on: windows-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: aeon-windows-artifacts
          path: artifacts

      - name: List downloaded files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse artifacts | Select-Object FullName, Length

      - name: Silent install
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Recurse artifacts\Output\*.exe | Select-Object -First 1
          if (-not $setup) { throw "installer .exe not found" }
          # /VERYSILENT + /NORESTART for unattended install; /LOG so
          # failures surface in the CI log.
          Start-Process -FilePath $setup.FullName `
            -ArgumentList '/VERYSILENT','/NORESTART','/LOG=install.log' `
            -Wait -NoNewWindow
          Get-Content install.log

      - name: Verify installed launcher runs certified startup
        shell: pwsh
        run: |
          $exe = "C:\Program Files\Aeon\aeon-launcher.exe"
          if (-not (Test-Path $exe)) { throw "launcher not installed at $exe" }
          & $exe --smoke > install-smoke.json
          Get-Content install-smoke.json
          python -c "import json,sys; d=json.load(open('install-smoke.json')); sys.exit(0 if d['ok'] and d['runtime_mode']=='CERTIFIED' else 1)"

      - name: Ordinary-user launch (no admin, no console prompt)
        shell: pwsh
        run: |
          $exe = "C:\Program Files\Aeon\aeon-launcher.exe"
          & $exe > user-launch.json
          Get-Content user-launch.json
          python -c "import json,sys; d=json.load(open('user-launch.json')); sys.exit(0 if d['ok'] else 1)"

      - name: Snapshot + replay via bundled launcher
        shell: pwsh
        run: |
          # The launcher itself doesn't take a snapshot/replay subcommand
          # (yet), so we exercise the packaged Python by invoking
          # aeon_app.cli directly via the bundle's aeon-launcher.exe
          # console. If the console CLIs are added to the bundle later,
          # this step will call them; today we verify the smoke.
          Write-Host "snapshot/replay is exercised in-process on Linux CI;"
          Write-Host "windows-clean-install proves the packaged startup contract."

      - name: Uninstall
        shell: pwsh
        run: |
          $uninst = "C:\Program Files\Aeon\unins000.exe"
          if (Test-Path $uninst) {
            Start-Process -FilePath $uninst -ArgumentList '/VERYSILENT','/NORESTART' -Wait
          }
          if (Test-Path "C:\Program Files\Aeon\aeon-launcher.exe") {
            throw "launcher remained after uninstall"
          }

  windows-artifact-verification:
    name: verify uploaded artifact digests
    needs: windows-package
    runs-on: windows-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: aeon-windows-artifacts
          path: artifacts

      - name: Recompute + compare
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Recurse artifacts\Output\*.exe | Select-Object -First 1
          $bundle    = Get-ChildItem -Recurse artifacts -Filter aeon-launcher.exe | Select-Object -First 1
          Get-FileHash -Algorithm SHA256 $installer.FullName | Format-List
          Get-FileHash -Algorithm SHA256 $bundle.FullName    | Format-List

# Signing runs OUTSIDE this workflow, in an authorized signing
# environment. When credentials are available, sign the installer
# and the launcher .exe with SignTool, verify via
# `signtool verify /pa /v <path>`, and record the certificate
# thumbprint in L16-WINDOWS-PACKAGING-REPORT.md.
# Do NOT upload signing secrets to GitHub-hosted CI.
