name: aeon-windows

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# L16 packaging must run on a genuine Windows host. The mandate
# rejects Linux-built binaries renamed .exe. Every job in this
# workflow requires windows-latest.
#
# The build + validate stages are consolidated into one job so
# no artifact hand-off is required (the GitHub Actions artifact
# storage quota on this account is an environmental constraint
# unrelated to Windows packaging correctness). Artifact upload
# is attempted at the end and is best-effort; if it fails the
# validate stages have already proven the build.

jobs:
  windows-build-and-validate:
    name: build + validate Windows bundle + installer on windows-latest
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime + PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./aeon-language
          python -m pip install --no-deps ./aeon-application
          python -m pip install pyinstaller

      - name: Build PyInstaller onedir bundle
        shell: pwsh
        working-directory: aeon-application
        run: |
          pyinstaller --clean --noconfirm packaging\windows\aeon-launcher.spec
          Get-ChildItem dist\aeon-launcher | Select-Object -First 20

      - name: Bundle sanity check (invoke launcher with --smoke)
        shell: pwsh
        working-directory: aeon-application
        run: |
          dist\aeon-launcher\aeon-launcher.exe --smoke > bundle-smoke.json
          type bundle-smoke.json
          python -c "import json; d=json.load(open('bundle-smoke.json')); assert d['ok'] is True, d; assert d['runtime_mode']=='CERTIFIED', d; assert d['startup']['configuration_digest']=='5cd0371f157fe9dd921c45b888ece3228aee7f9b3a247968e6c7714fdb88753d', d"

      - name: Build Inno Setup installer
        shell: pwsh
        working-directory: aeon-application/packaging/windows
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc aeon-installer.iss
          Get-ChildItem Output

      - name: Compute SHA-256 checksums
        shell: pwsh
        working-directory: aeon-application
        run: |
          Get-ChildItem packaging\windows\Output\*.exe |
            Get-FileHash -Algorithm SHA256 |
            Format-List | Tee-Object -FilePath windows-installer.sha256.txt
          Get-ChildItem dist\aeon-launcher\aeon-launcher.exe |
            Get-FileHash -Algorithm SHA256 |
            Format-List | Tee-Object -FilePath windows-bundle.sha256.txt

      - name: Silent-install the produced installer
        shell: pwsh
        working-directory: aeon-application
        run: |
          $setup = Get-ChildItem packaging\windows\Output\*.exe | Select-Object -First 1
          if (-not $setup) { throw "installer .exe not found" }
          Start-Process -FilePath $setup.FullName `
            -ArgumentList '/VERYSILENT','/NORESTART','/LOG=install.log' `
            -Wait -NoNewWindow
          Get-Content install.log

      - name: Verify installed launcher runs certified startup
        shell: pwsh
        run: |
          $exe = "C:\Program Files\Aeon\aeon-launcher.exe"
          if (-not (Test-Path $exe)) { throw "launcher not installed at $exe" }
          & $exe --smoke > install-smoke.json
          Get-Content install-smoke.json
          python -c "import json,sys; d=json.load(open('install-smoke.json')); sys.exit(0 if d['ok'] and d['runtime_mode']=='CERTIFIED' else 1)"

      - name: Ordinary-user launch (no admin, no console prompt)
        shell: pwsh
        run: |
          $exe = "C:\Program Files\Aeon\aeon-launcher.exe"
          & $exe > user-launch.json
          Get-Content user-launch.json
          python -c "import json,sys; d=json.load(open('user-launch.json')); sys.exit(0 if d['ok'] else 1)"

      - name: Uninstall
        shell: pwsh
        run: |
          $uninst = "C:\Program Files\Aeon\unins000.exe"
          if (Test-Path $uninst) {
            Start-Process -FilePath $uninst -ArgumentList '/VERYSILENT','/NORESTART' -Wait
          }
          if (Test-Path "C:\Program Files\Aeon\aeon-launcher.exe") {
            throw "launcher remained after uninstall"
          }

      # Best-effort artifact upload for operator review. May be
      # blocked by GitHub Actions storage quota on this account;
      # the previous steps already proved the build. continue-on-error
      # so a quota-blocked upload does not falsely fail the job.
      - name: Upload Windows artifacts (best-effort)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: aeon-windows-artifacts
          path: |
            aeon-application/dist/aeon-launcher/**
            aeon-application/packaging/windows/Output/*.exe
            aeon-application/windows-installer.sha256.txt
            aeon-application/windows-bundle.sha256.txt
            aeon-application/bundle-smoke.json
            aeon-application/install-smoke.json
            aeon-application/user-launch.json
            aeon-application/install.log
          if-no-files-found: error

# Signing runs OUTSIDE this workflow, in an authorized signing
# environment. When credentials are available, sign the installer
# and the launcher .exe with SignTool, verify via
# `signtool verify /pa /v <path>`, and record the certificate
# thumbprint in L16-WINDOWS-PACKAGING-REPORT.md.
# Do NOT upload signing secrets to GitHub-hosted CI.
