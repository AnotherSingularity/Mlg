[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeon-language"
version = "0.1.0"
description = "Aeon Language: framework-neutral kernel, compiler, reference runtime, and conformance suite."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "AnotherSingularity" }]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.26"]
dev = ["pytest>=7.0"]

[project.scripts]
aeonc = "compiler.cli:aeonc"
aeonrun = "compiler.cli:aeonrun"
aeoncheck = "compiler.cli:aeoncheck"
aeonfmt = "compiler.cli:aeonfmt"
aeonir = "compiler.cli:aeonir"
aeongraph = "compiler.cli:aeongraph"
aeontest = "compiler.cli:aeontest"
aeonreplay = "compiler.cli:aeonreplay"
aeonmigrate = "compiler.cli:aeonmigrate"

[tool.setuptools]
package-dir = {"aeon" = "standard_library/aeon", "compiler" = "compiler", "runtime" = "runtime", "backends" = "backends", "conformance" = "conformance", "release" = "release"}

[tool.setuptools.packages.find]
where = ["standard_library", "."]
include = ["aeon", "aeon.*", "compiler", "compiler.*", "runtime", "runtime.*", "backends", "backends.*", "conformance", "conformance.*", "release", "release.*"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
"aeon" = ["*.json"]
"conformance" = ["*.json", "fixtures/**/*.json"]
